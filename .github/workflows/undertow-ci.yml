name: Undertow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: undertow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet format Undertow.slnx --verify-no-changes
      - run: dotnet fantomas --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Undertow.slnx -warnaserror
      - run: dotnet test Undertow.slnx --no-build
      - name: Vulnerable package scan
        run: |
          dotnet list Undertow.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: undertow:ci
      - name: Verify container
        run: |
          docker run -d --name undertow-ci \
            -p 3000:3000 \
            -e UNDERTOW_JWT_SECRET=ci-secret \
            -e UNDERTOW_STORAGE_BACKEND=memory \
            undertow:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          docker logs undertow-ci
          exit 1
      - if: always()
        run: docker rm -f undertow-ci 2>/dev/null || true

  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tylerbutler/floodgate
          path: floodgate
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: floodgate/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: floodgate/client
      - uses: extractions/setup-just@v2
      - run: just test-dual-mode
        env:
          FLOODGATE_REPO: floodgate
